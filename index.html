<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traçado pontilhado — Jardim 2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf7ff;color:#39334d;font-family:Arial,system-ui,sans-serif}
header{text-align:center;padding:18px 12px}h1{margin:0;font-size:clamp(1.5rem,4vw,2.4rem)}header p{margin:7px 0;color:#766e88}
main{max-width:1200px;margin:auto;padding:12px}.panel{background:white;border:2px solid #ece5f6;border-radius:24px;padding:clamp(14px,2.5vw,28px);box-shadow:0 8px 24px #3020500c}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:850px;margin:24px auto}
.choice{border:0;border-radius:22px;padding:30px 14px;min-height:190px;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:800;color:#39334d;cursor:pointer}.choice span{display:block;font-size:1rem;font-weight:500;margin-top:10px}.a{background:#eee8fc}.b{background:#e3f5ec}
.top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px}.top h2{margin:0}.buttons{display:flex;gap:8px;flex-wrap:wrap}
button.action{border:0;border-radius:12px;padding:11px 15px;font-weight:700;background:#eee8fc;color:#39334d;cursor:pointer}button.next{background:#e75b91;color:white}
#tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 14px}#tabs button{border:1px solid #ddd4eb;border-radius:9px;background:white;padding:7px 10px;font-weight:700;color:#514967}#tabs button.active{background:#f9dce8;border-color:#e75b91}
.paper{border:2px solid #e9e4ef;border-radius:16px;padding:8px;background:white}canvas{display:block;width:100%;height:auto;touch-action:none}
.note{text-align:center;color:#746d80;margin:10px 0 0}.hide{display:none!important}
@media(max-width:600px){.choices{grid-template-columns:1fr}.choice{min-height:140px}.buttons{width:100%}.action{flex:1}}
</style></head>
<body>
<header><h1>🌟 Vamos traçar!</h1><p>Cubra os pontinhos com o dedo, mouse ou caneta</p></header>
<main>
<section id="home" class="panel"><h2 style="text-align:center">Escolha sua atividade</h2>
<div class="choices">
<button class="choice a" onclick="start('syllables')">🔤 Sílabas<span>Treine as famílias silábicas</span></button>
<button class="choice b" onclick="start('numbers')">🔢 Números<span>Treine os números de 0 a 20</span></button>
</div></section>
<section id="work" class="panel hide">
<div class="top"><h2 id="heading">Traçado</h2><div class="buttons">
<button class="action" onclick="say()">🔊 Ouvir</button><button class="action" onclick="redraw()">↻ Recomeçar</button><button class="action next" onclick="advance()">Próximo ➜</button><button class="action" onclick="home()">Início</button>
</div></div>
<div id="tabs"></div>
<div class="paper"><canvas id="c" width="1400" height="600"></canvas></div>
<p class="note">A letra ou o número é formado inteiramente por pontinhos. Passe por cima deles para cobrir o modelo.</p>
</section></main>
<script>
const fam=[["A","E","I","O","U"],["BA","BE","BI","BO","BU"],["CA","CE","CI","CO","CU"],["DA","DE","DI","DO","DU"],["FA","FE","FI","FO","FU"],["GA","GE","GI","GO","GU"],["JA","JE","JI","JO","JU"],["LA","LE","LI","LO","LU"],["MA","ME","MI","MO","MU"],["NA","NE","NI","NO","NU"],["PA","PE","PI","PO","PU"],["QUE","QUI"],["RA","RE","RI","RO","RU"],["SA","SE","SI","SO","SU"],["TA","TE","TI","TO","TU"],["VA","VE","VI","VO","VU"],["XA","XE","XI","XO","XU"],["ZA","ZE","ZI","ZO","ZU"],["CHA","CHE","CHI","CHO","CHU"],["LHA","LHE","LHI","LHO","LHU"],["NHA","NHE","NHI","NHO","NHU"]];
const syll=fam.flat(), nums=Array.from({length:21},(_,i)=>String(i));
let items=[],idx=0,kind='syllables',drawing=false,last=null;
const c=document.getElementById('c'),g=c.getContext('2d');
function start(k){kind=k;items=k==='syllables'?syll:nums;idx=0;document.getElementById('home').classList.add('hide');document.getElementById('work').classList.remove('hide');document.getElementById('heading').textContent=k==='syllables'?'🔤 Traçado de sílabas':'🔢 Traçado de números';paint()}
function home(){document.getElementById('work').classList.add('hide');document.getElementById('home').classList.remove('hide')}
function paint(){document.getElementById('tabs').innerHTML=items.map((v,i)=>`<button class="${i===idx?'active':''}" onclick="choose(${i})">${v}</button>`).join('');makeDots();drawing=false}
function choose(i){idx=i;paint()}function advance(){idx=(idx+1)%items.length;paint()}
function makeDots(){
 g.clearRect(0,0,c.width,c.height);g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
 const mask=document.createElement('canvas');mask.width=c.width;mask.height=c.height;const m=mask.getContext('2d');
 const s=items[idx].length>=3?285:items[idx].length===2?350:420;
 m.fillStyle='#000';m.textAlign='center';m.textBaseline='middle';m.font=`bold ${s}px Arial, sans-serif`;
 m.fillText(items[idx],c.width/2,c.height/2,c.width-100);
 const a=m.getImageData(0,0,c.width,c.height).data;
 // Amostra a área preenchida do caractere e desenha pontos separados e regulares.
 // Assim, toda a letra (não apenas seu contorno) fica composta por pontinhos.
 const step=15, radius=3.1;
 g.fillStyle='#8f79b9';
 for(let y=0;y<c.height;y+=step)for(let x=0;x<c.width;x+=step){
  if(a[(y*c.width+x)*4+3]>90){g.beginPath();g.arc(x,y,radius,0,Math.PI*2);g.fill()}
 }
 // Linha de base suave, como em folha de caligrafia.
 g.strokeStyle='#eeeaf2';g.lineWidth=2;g.setLineDash([8,12]);g.beginPath();g.moveTo(65,505);g.lineTo(1335,505);g.stroke();g.setLineDash([]);
}
function redraw(){makeDots()}
function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
c.addEventListener('pointerdown',e=>{drawing=true;last=point(e);c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);g.strokeStyle='#e75b91';g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(last.x,last.y);g.lineTo(p.x,p.y);g.stroke();last=p});
function stop(){drawing=false;last=null}c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);
function say(){if(!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(items[idx]);u.lang='pt-BR';speechSynthesis.cancel();speechSynthesis.speak(u)}
</script></body></html>
