<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprendendo e Traçando — Jardim 2</title>
<style>
:root{--ink:#34304b;--pink:#e85d91;--lav:#eee9fb;--mint:#e4f6ef;--yellow:#fff3cf;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#f8f4ff,#fff9ef);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);min-height:100vh}
header{text-align:center;padding:22px 14px 10px}
h1{font-size:clamp(1.6rem,4vw,2.5rem);margin:0 0 6px}
header p{margin:0;color:#69627c;font-size:1.05rem}
main{max-width:1180px;margin:auto;padding:14px}
.panel{background:#fff;border:3px solid #eee8fa;border-radius:28px;padding:clamp(16px,3vw,30px);box-shadow:0 10px 30px #53447a12}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:800px;margin:25px auto}
.choice{border:0;border-radius:26px;padding:35px 15px;min-height:210px;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:850;color:var(--ink);cursor:pointer;box-shadow:0 6px 0 #00000012;transition:.15s}
.choice:hover{transform:translateY(-3px)}
.choice small{display:block;font-size:1rem;font-weight:600;margin-top:8px}
.syll{background:var(--lav)}.nums{background:var(--mint)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.toolbar h2{margin:0;font-size:clamp(1.3rem,3vw,1.8rem)}
.controls{display:flex;flex-wrap:wrap;gap:9px}
button{font:inherit}
.btn{border:0;border-radius:14px;padding:12px 17px;background:#eee9fb;color:var(--ink);font-weight:750;cursor:pointer}
.btn.primary{background:var(--pink);color:white}
.btn:active,.choice:active{transform:scale(.98)}
.sheet{background:#fff;border:2px solid #e8e3ef;border-radius:20px;padding:12px;box-shadow:inset 0 0 0 5px #faf9fc}
canvas{display:block;width:100%;height:auto;touch-action:none;border-radius:12px;background:white}
.tip{text-align:center;color:#777087;margin:10px 0 0;font-size:.98rem}
.progress{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:12px 0}
.progress button{border:1px solid #ddd5ec;background:white;border-radius:10px;padding:7px 11px;cursor:pointer;font-weight:700}
.progress button.active{background:#fbe0eb;border-color:var(--pink)}
.hidden{display:none!important}
footer{text-align:center;color:#8a8498;font-size:.85rem;padding:18px}
@media(max-width:600px){.cards{grid-template-columns:1fr}.choice{min-height:150px;padding:22px}.toolbar{align-items:flex-start}.controls{width:100%}.btn{flex:1}}
</style>
</head>
<body>
<header><h1>🌈 Aprendendo e Traçando</h1><p>Uma atividade de coordenação motora para o Jardim 2</p></header>
<main>
<section id="home" class="panel">
  <h2 style="text-align:center;margin:8px 0">O que vamos traçar hoje?</h2>
  <div class="cards">
    <button class="choice syll" onclick="openMode('syllables')">🔤 Sílabas<small>Vamos treinar as famílias silábicas</small></button>
    <button class="choice nums" onclick="openMode('numbers')">🔢 Números<small>Vamos traçar do 0 ao 20</small></button>
  </div>
</section>
<section id="practice" class="panel hidden">
  <div class="toolbar">
    <h2 id="modeTitle">Traçando</h2>
    <div class="controls">
      <button class="btn" onclick="speak()">🔊 Ouvir</button>
      <button class="btn" onclick="clearDrawing()">↺ Apagar traçado</button>
      <button class="btn primary" onclick="nextItem()">Próximo ➜</button>
      <button class="btn" onclick="goHome()">⌂ Início</button>
    </div>
  </div>
  <div id="progress" class="progress"></div>
  <div class="sheet"><canvas id="board" width="1200" height="520" aria-label="Área para traçar sobre os pontinhos"></canvas></div>
  <p class="tip">Passe o dedo, o mouse ou a caneta por cima dos pontinhos para formar a sílaba ou o número.</p>
</section>
</main>
<footer>Aprender brincando é muito melhor! 💜</footer>
<script>
const families = [
["A","E","I","O","U"],["BA","BE","BI","BO","BU"],["CA","CE","CI","CO","CU"],
["DA","DE","DI","DO","DU"],["FA","FE","FI","FO","FU"],["GA","GE","GI","GO","GU"],
["JA","JE","JI","JO","JU"],["LA","LE","LI","LO","LU"],["MA","ME","MI","MO","MU"],
["NA","NE","NI","NO","NU"],["PA","PE","PI","PO","PU"],["QUE","QUI"],
["RA","RE","RI","RO","RU"],["SA","SE","SI","SO","SU"],["TA","TE","TI","TO","TU"],
["VA","VE","VI","VO","VU"],["XA","XE","XI","XO","XU"],["ZA","ZE","ZI","ZO","ZU"],
["CHA","CHE","CHI","CHO","CHU"],["LHA","LHE","LHI","LHO","LHU"],["NHA","NHE","NHI","NHO","NHU"]
];
const syllables=families.flat();
const numbers=Array.from({length:21},(_,i)=>String(i));
let mode="syllables", index=0, items=[];
const canvas=document.getElementById("board"), ctx=canvas.getContext("2d");
let drawing=false, last=null;
function openMode(which){mode=which;items=which==="syllables"?syllables:numbers;index=0;document.getElementById("home").classList.add("hidden");document.getElementById("practice").classList.remove("hidden");document.getElementById("modeTitle").textContent=which==="syllables"?"🔤 Traçado de sílabas":"🔢 Traçado de números";render()}
function goHome(){document.getElementById("practice").classList.add("hidden");document.getElementById("home").classList.remove("hidden")}
function render(){
  document.getElementById("progress").innerHTML=items.map((v,i)=>`<button class="${i===index?'active':''}" onclick="selectItem(${i})">${v}</button>`).join("");
  drawGuide();clearDrawing(false);
}
function selectItem(i){index=i;render()}
function nextItem(){index=(index+1)%items.length;render()}
function drawGuide(){
  ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
  const value=items[index];
  // Build a raster mask of the character(s), then sample it on a regular grid.
  // The guide is made ONLY of separate dots — there is no pale solid letter underneath.
  const mask=document.createElement("canvas");mask.width=canvas.width;mask.height=canvas.height;
  const m=mask.getContext("2d");
  const size=value.length>=3?235:value.length===2?285:350;
  m.clearRect(0,0,mask.width,mask.height);m.fillStyle="#000";m.textAlign="center";m.textBaseline="middle";
  m.font=`700 ${size}px Arial, sans-serif`;
  // Slightly condensed only for long combinations, keeping the whole guide large.
  m.fillText(value,canvas.width/2,canvas.height/2,canvas.width-100);
  const pixels=m.getImageData(0,0,mask.width,mask.height).data;
  const step=11, radius=2.35;
  ctx.fillStyle="#b9a9d8";
  for(let y=0;y<canvas.height;y+=step){
    for(let x=0;x<canvas.width;x+=step){
      if(pixels[(y*canvas.width+x)*4+3]>100){
        ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();
      }
    }
  }
  // Baseline helps the child position the writing, like a worksheet.
  ctx.strokeStyle="#eee9f4";ctx.lineWidth=2;ctx.setLineDash([7,10]);ctx.beginPath();ctx.moveTo(55,430);ctx.lineTo(1145,430);ctx.stroke();ctx.setLineDash([]);
}
function clearDrawing(redraw=true){if(redraw)drawGuide();else drawGuide()}
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
canvas.addEventListener("pointerdown",e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!drawing)return;const p=pos(e);ctx.strokeStyle="#e85d91";ctx.lineWidth=6;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});
function stop(){drawing=false;last=null}
canvas.addEventListener("pointerup",stop);canvas.addEventListener("pointercancel",stop);canvas.addEventListener("pointerleave",e=>{if(e.buttons===0)stop()});
function speak(){const utter=new SpeechSynthesisUtterance(items[index]);utter.lang="pt-BR";speechSynthesis.cancel();speechSynthesis.speak(utter)}
</script>
</body>
</html>
